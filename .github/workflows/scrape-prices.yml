# RETIRED - this workflow no longer scrapes on a schedule.
#
# PriceCharting began returning 403 Forbidden to GitHub Actions runner IPs in
# October 2026. Every one of the 69 items failed with 403 on 2026-10-12, while
# the identical request from a residential connection still returned 200 (even
# with no User-Agent), so the block is on the runner's IP range rather than on
# headers or rate. Working around that would mean evading an access control the
# site deliberately put in place, so we did not.
#
# The scrape now runs on an always-on Mac on a home connection, scheduled by
# launchd, and uploads prices.json through the GitHub Contents API. See
# scripts/scrape_prices.py, which that job fetches from this repo so this
# remains the single source of truth for the scraping logic.
#
# The schedule trigger is removed so this stops failing every Monday and mailing
# a failure notice. Manual dispatch is kept only so the 403 can be re-tested
# cheaply if PriceCharting's policy ever changes; expect it to fail until then.

name: Scrape prices

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape PriceCharting
        run: python3 scripts/scrape_prices.py

      - name: Commit prices.json
        run: |
          set -euo pipefail
          if git diff --quiet -- prices.json; then
            echo "prices.json unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Scrape prices $(date -u +%Y-%m-%d)"
          git push
